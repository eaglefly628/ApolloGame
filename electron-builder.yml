appId: com.apollo.gameg
electronVersion: "33.0.0"
productName: FateflipPoker
copyright: "Copyright © 2025 Apollo Game Studio"

# Only ship the Electron main + preload + Steam 绑定 + the pre-built web bundle; nothing else.
files:
  - electron/main.cjs
  - electron/preload.cjs
  - electron/steam.cjs
  - dist-cartridge/**
  - package.json
  - steam_appid.txt

# steamworks.js 是原生 .node 模块，必须从 asar 解包才能在打包后 require 成功。
asarUnpack:
  - "**/node_modules/steamworks.js/**"

# steam_appid.txt 需与可执行文件同目录（Steam 据它识别 appId）；放进 app 资源根。
extraResources:
  - from: steam_appid.txt
    to: ../steam_appid.txt

directories:
  output: release/game-g/bin

mac:
  category: public.app-category.games
  # 无 Apple 开发者账号 → 显式 ad-hoc 签名（identity:null），产物是「确定的本地签名」而非半签。
  # 别的 Mac 仍会因「未公证」被 Gatekeeper 拦（报「已损坏」/「无法验证开发者」），
  # 对方用「右键→打开」或 `xattr -cr <App>` 放行一次即可（见 release 里的 先读我_MAC放行.txt）。
  identity: null
  target:
    - target: dmg
      arch: [arm64]   # 只打 Apple 芯片（对方机器也是 Apple 芯片，问题在签名而非架构）

win:
  target:
    - target: zip           # zip works without wine on Mac; use nsis on a Windows CI for .exe
      arch: [x64]
