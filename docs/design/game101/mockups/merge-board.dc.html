<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;showLedger&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;占位&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const showLedger = this.props.showLedger ?? true;
    const cols = 7, rows = 9, cell = 132, gap = 8, x0 = 54, y0 = 580;
    const pos = (c, r) => ({ left: x0 + c * (cell + gap), top: y0 + r * (cell + gap) });

    const bg = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const p = pos(c, r);
      bg.push({ style: "position:absolute;left:" + p.left + "px;top:" + p.top + "px;width:" + cell + "px;height:" + cell + "px;border-radius:18px;background:rgba(255,255,255,.38);box-shadow:inset 0 2px 5px rgba(150,110,70,.14),inset 0 -1px 0 rgba(255,255,255,.55);z-index:1" });
    }

    const tileBase = (p, extra) => "position:absolute;left:" + p.left + "px;top:" + p.top + "px;width:" + cell + "px;height:" + cell + "px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:62px;box-shadow:0 7px 14px -6px rgba(160,110,60,.4),inset 0 -3px 0 rgba(220,170,120,.3);z-index:3;" + extra;
    const normalBg = "background:linear-gradient(160deg,#fff,#ffe9cf);";
    const energyBg = "background:linear-gradient(160deg,#efe0ff,#d3b3f7);";
    const bubbleBg = "color:rgba(90,70,50,.4);background:radial-gradient(58% 52% at 36% 30%, rgba(255,255,255,.95), rgba(180,225,245,.6) 55%, rgba(120,200,235,.5));box-shadow:0 7px 14px -6px rgba(70,150,190,.5),inset 0 0 0 3px rgba(255,255,255,.55);";

    // 生成器占位: (0,0)(2,0)(4,0)(6,0)(0,1) — 由静态 div 渲染，itemDefs 跳过
    const itemDefs = [
      { c: 1, r: 0, g: "🛍️", arrow: 1 }, { c: 3, r: 0, g: "🧺", arrow: 1 }, { c: 5, r: 0, g: "📦", arrow: 1 },
      { c: 1, r: 1, g: "🥔" }, { c: 2, r: 1, g: "🌱" }, { c: 3, r: 1, g: "🪴" }, { c: 4, r: 1, g: "🫘", arrow: 1 }, { c: 5, r: 1, g: "🪸" }, { c: 6, r: 1, g: "🗑️" },
      { c: 0, r: 2, g: "🛒" }, { c: 1, r: 2, g: "🍜", check: 1 }, { c: 2, r: 2, g: "🍜" }, { c: 3, r: 2, g: "🍜" }, { c: 4, r: 2, g: "🍜" }, { c: 5, r: 2, g: "🩴" }, { c: 6, r: 2, g: "🦆" },
      { c: 0, r: 3, g: "☕" }, { c: 1, r: 3, g: "🍟" }, { c: 2, r: 3, g: "🍟" }, { c: 3, r: 3, g: "🍟" }, { c: 4, r: 3, g: "🍜" }, { c: 5, r: 3, g: "🪣" }, { c: 6, r: 3, g: "🧺" },
      { c: 1, r: 4, g: "🍟" }, { c: 2, r: 4, g: "🍟" }, { c: 3, r: 4, g: "🍟" }, { c: 4, r: 4, g: "🍟" }, { c: 6, r: 4, g: "⚗️", energy: 1 },
      { c: 0, r: 5, g: "✂️" }, { c: 1, r: 5, g: "🍟" }, { c: 2, r: 5, g: "🍟" }, { c: 3, r: 5, g: "🍟", check: 1 }, { c: 6, r: 5, g: "🧪", energy: 1, sel: 1 },
      { c: 0, r: 6, g: "🎣" }, { c: 1, r: 6, g: "🍰", check: 1 }, { c: 2, r: 6, g: "☕", check: 1 }, { c: 3, r: 6, g: "🍩" }, { c: 4, r: 6, g: "🌰", arrow: 1 }, { c: 5, r: 6, g: "🪙" }, { c: 6, r: 6, g: "🐚" },
      { c: 0, r: 7, g: "🥪" }, { c: 1, r: 7, g: "🥗" }, { c: 2, r: 7, g: "🥐", check: 1 }, { c: 3, r: 7, g: "🍞" }, { c: 4, r: 7, g: "🐟" }, { c: 5, r: 7, g: "🪙" }, { c: 6, r: 7, g: "🥜" },
      { c: 0, r: 8, g: "🛒" }, { c: 1, r: 8, g: "🥖" }, { c: 2, r: 8, g: "🍊", check: 1 }, { c: 3, r: 8, g: "🍅", bubble: 1, price: 40 }, { c: 4, r: 8, g: "🫧" }, { c: 5, r: 8, g: "⚓" }, { c: 6, r: 8, g: "🎉" },
    ];

    const items = [], badges = [];
    itemDefs.forEach((d) => {
      const p = pos(d.c, d.r);
      let extra = d.bubble ? bubbleBg : (d.energy ? energyBg : normalBg);
      if (d.sel) extra += "box-shadow:0 0 0 4px #2fd0e6,0 8px 16px -6px rgba(40,180,200,.6);";
      items.push({ style: tileBase(p, extra), glyph: d.g });
      const brBadge = (color) => "position:absolute;left:" + (p.left + cell - 44) + "px;top:" + (p.top + cell - 40) + "px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;background:" + color + ";box-shadow:0 3px 7px rgba(0,0,0,.25);z-index:6;";
      if (d.arrow) badges.push({ style: brBadge("#FF5C8A"), glyph: "🡇" });
      if (d.check) badges.push({ style: brBadge("#4FBE5E"), glyph: "✓" });
      if (d.price) badges.push({ style: "position:absolute;left:" + (p.left + cell / 2 - 30) + "px;top:" + (p.top + cell - 28) + "px;font-weight:800;font-size:19px;color:#fff;background:linear-gradient(160deg,#F7C94B,#F4B740);border-radius:14px;padding:2px 11px;box-shadow:0 3px 8px rgba(120,80,20,.35);z-index:6;", glyph: "🪙" + d.price });
    });

    return { showLedger, bg, items, badges };
  }
}
</script>
</body>
</html>
