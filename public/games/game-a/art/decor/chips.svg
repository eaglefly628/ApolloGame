<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="dc_side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2530"/>
      <stop offset="1" stop-color="#3e1218"/>
    </linearGradient>
    <radialGradient id="dc_top" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#a4384a"/>
      <stop offset="1" stop-color="#5a1c24"/>
    </radialGradient>
  </defs>

  <!-- cylinder side of the stack -->
  <path d="M22 52 L22 88 A38 12 0 0 0 98 88 L98 52 Z" fill="url(#dc_side)" stroke="#a9791f" stroke-width="1.4"/>
  <!-- chip separations -->
  <g fill="none" stroke="#f0c96a" stroke-opacity="0.45" stroke-width="1.3">
    <path d="M22 61 Q60 71 98 61"/>
    <path d="M22 70 Q60 80 98 70"/>
    <path d="M22 79 Q60 89 98 79"/>
  </g>
  <!-- edge spots on the front chip -->
  <g fill="#f0c96a" fill-opacity="0.8">
    <rect x="36" y="82" width="3" height="8" rx="1.5"/>
    <rect x="58" y="85" width="3" height="8" rx="1.5"/>
    <rect x="80" y="82" width="3" height="8" rx="1.5"/>
  </g>

  <!-- top face -->
  <ellipse cx="60" cy="52" rx="38" ry="12" fill="url(#dc_top)" stroke="#f0c96a" stroke-width="1.8"/>
  <ellipse cx="60" cy="52" rx="27" ry="8" fill="none" stroke="#f0c96a" stroke-opacity="0.6" stroke-width="1.2"/>
  <g fill="#f0c96a">
    <path d="M60 46 l4 6 -4 6 -4 -6 z"/>
  </g>
  <g stroke="#f0c96a" stroke-opacity="0.7" stroke-width="1.4">
    <line x1="22" y1="52" x2="30" y2="52"/>
    <line x1="90" y1="52" x2="98" y2="52"/>
  </g>
</svg>
