<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="168" height="240" viewBox="0 0 168 240">
  <defs>
    <linearGradient id="bk_field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a1f26"/>
      <stop offset="0.55" stop-color="#4a161c"/>
      <stop offset="1" stop-color="#360f14"/>
    </linearGradient>
    <radialGradient id="bk_med" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c8352b"/>
      <stop offset="1" stop-color="#6a1f26"/>
    </radialGradient>
    <g id="bk_corn" fill="none" stroke="#f0c96a" stroke-width="1.8" stroke-linecap="round">
      <path d="M2 40 Q2 2 40 2"/>
      <path d="M12 40 Q12 12 40 12" stroke-opacity="0.55"/>
      <path d="M2 40 Q22 40 22 20 Q22 12 30 12"/>
      <circle cx="34" cy="34" r="3.2" fill="#f0c96a" stroke="none"/>
    </g>
  </defs>

  <rect x="2" y="2" width="164" height="236" rx="14" fill="url(#bk_field)"/>
  <rect x="8" y="8" width="152" height="224" rx="11" fill="none" stroke="#f0c96a" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="13" y="13" width="142" height="214" rx="8" fill="none" stroke="#c8352b" stroke-opacity="0.7" stroke-width="1.3"/>

  <!-- symmetric corner filigree -->
  <use href="#bk_corn" xlink:href="#bk_corn" transform="translate(18,18)"/>
  <use href="#bk_corn" xlink:href="#bk_corn" transform="translate(150,18) scale(-1,1)"/>
  <use href="#bk_corn" xlink:href="#bk_corn" transform="translate(18,222) scale(1,-1)"/>
  <use href="#bk_corn" xlink:href="#bk_corn" transform="translate(150,222) scale(-1,-1)"/>

  <!-- center medallion -->
  <g>
    <circle cx="84" cy="120" r="30" fill="none" stroke="#f0c96a" stroke-opacity="0.6" stroke-width="1.3"/>
    <circle cx="84" cy="120" r="24" fill="url(#bk_med)" stroke="#f0c96a" stroke-width="1.6"/>
    <path d="M84 102 L90 120 L84 138 L78 120 Z" fill="#f0c96a"/>
    <path d="M66 120 L84 114 L102 120 L84 126 Z" fill="#f0c96a" fill-opacity="0.9"/>
    <circle cx="84" cy="120" r="4" fill="#360f14"/>
  </g>

  <!-- top & bottom center flourishes -->
  <g fill="#f0c96a" fill-opacity="0.8">
    <path d="M84 26 l5 6 -5 6 -5 -6 z"/>
    <path d="M84 214 l5 6 -5 6 -5 -6 z"/>
  </g>
</svg>
