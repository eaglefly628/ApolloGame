<!DOCTYPE html>
<html>
<head>

<!--

  忠实移植自 design/UI/「Game G 对战 三路战场.dc.html」：themes()/renderVals()/几何 逐字照搬，
  仅把 DC 的 {{ }}/sc-for 绑定换成原生渲染。这是要落进真游戏的那一版（不依赖 support.js）。
  当前喂样例数据（与设计稿同），确认像了之后再接真 sim。浏览器直接打开即可看。

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dae2; }
  @keyframes g-tossL { 0%,100% { transform: translate(-50%,-50%) rotate(-15deg); } 50% { transform: translate(-50%,-64%) rotate(-21deg); } }
  @keyframes g-tossR { 0%,100% { transform: translate(-50%,-50%) rotate(16deg); } 50% { transform: translate(-50%,-38%) rotate(24deg); } }
  @keyframes g-pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes g-shimmer { 0% { background-position: -120% 0; } 100% { background-position: 220% 0; } }
  @keyframes g-march { 0%,100% { transform: translate(-50%,-50%) rotate(var(--rot,0deg)); } 50% { transform: translate(-50%,-56%) rotate(var(--rot,0deg)); } }
  @keyframes g-dash { to { stroke-dashoffset: -68; } }
  input[type=range].gz { -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; outline:none; }
  input[type=range].gz::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  /* 交互态复刻 design 的 style-hover/style-active（DC 原本逐元素带，原生版用 CSS 还原） */
  [data-act="lever"]:hover, [data-act="focus"]:hover, [data-act="lane"]:hover, [data-act="zoom"]:hover, [data-act="gate"]:hover { filter:brightness(1.08); transform:translateY(-2px); border-color:var(--accent); }
  [data-act="lever"]:active, [data-act="focus"]:active, [data-act="lane"]:active, [data-act="zoom"]:active, [data-act="gate"]:active, [data-act="ready"]:active { transform:translateY(1px) scale(.97); filter:brightness(.94); }
  [data-act="ready"]:hover { filter:brightness(1.08); transform:translateY(-2px); }
</style>
</head>
<body>
<div id="app"></div>
<script>
// 样式对象 → 内联 CSS 串（camelCase→kebab；DC 框架原本帮做的事）。
const st = (o) => Object.entries(o).map(([k, v]) => k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase()) + ':' + v).join(';');
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const App = {
  state: { theme: 'onyx', lever: 'weight', lane: 'mid', zoom: 0.85, camX: 1500, camY: 750, gates: { g1: true, g2: false } },
  _W: 3000, _H: 1500, _VPW: 1284, _VPH: 612, _OUT: 0.66667,

  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); this.render(); },
  clampAxis(c, world, vp, zoom) { const half = vp / (2 * zoom); if (2 * half >= world) return world / 2; return Math.max(half, Math.min(world - half, c)); },
  setCam(x, y) { const z = this.state.zoom; this.setState({ camX: this.clampAxis(x, this._W, this._VPW, z), camY: this.clampAxis(y, this._H, this._VPH, z) }); },
  setView(x, y, z) { z = Math.max(0.55, Math.min(2.6, z)); this.setState({ zoom: z, camX: this.clampAxis(x, this._W, this._VPW, z), camY: this.clampAxis(y, this._H, this._VPH, z) }); },
  setZoom(z) { this.setView(this.state.camX, this.state.camY, z); },
  mmTo(e) { const r = this._mmEl.getBoundingClientRect(); this.setCam((e.clientX - r.left) / r.width * this._W, (e.clientY - r.top) / r.height * this._H); },

  themes() {

        '--texture': 'repeating-linear-gradient(45deg, rgba(135,175,215,.05) 0 1px, transparent 1px 9px), repeating-linear-gradient(-45deg, rgba(135,175,215,.04) 0 1px, transparent 1px 9px)',
        '--hud-bg': 'linear-gradient(180deg,rgba(22,28,37,.95),rgba(14,18,24,.88))',
        '--dock-bg': 'linear-gradient(180deg,rgba(18,23,31,.7),rgba(10,13,18,.97))',
        '--panel-grad': 'linear-gradient(180deg,#1c2531,#121821)', '--panel-border': '#33404f', '--hairline': 'rgba(255,214,150,.12)', '--chip-bg': 'rgba(255,255,255,.05)',
        '--seg-track': '#161d27', '--seg-edge': '#2c313b', '--track': 'rgba(0,0,0,.5)',
        '--ink': '#e7edf3', '--ink-dim': '#7e8c9b',
        '--accent': '#ff5d2e', '--accent-grad': 'linear-gradient(180deg,#ff7a45,#ee4515)', '--accent-soft': 'rgba(255,93,46,.18)', '--accent-ink': '#1c0d06',
        '--hp': '#46d17a', '--gold': '#ffcb3d', '--gold-chip': 'rgba(255,203,61,.1)', '--danger': '#ff404f',
        '--btn-bg': 'linear-gradient(180deg,#283341,#1a222c)', '--btn-edge': '#3d4b5b', '--btn-text': '#dfe7ef',
        '--arena': 'radial-gradient(120% 120% at 50% 50%, #20402f, #11221a 78%)', '--arena-edge': '#0b1a13',
        '--ready-bg': 'linear-gradient(180deg,#ff7a45,#e8420f)', '--ready-text': '#1c0d06', '--ready-shadow': '0 0 22px rgba(255,93,46,.5), inset 0 1px 0 rgba(255,255,255,.4)',
        '--font-cjk': "'Noto Sans SC', sans-serif", '--font-display': "'Zhi Mang Xing', cursive", '--font-heading': "'Rajdhani', sans-serif", '--font-body': "'Noto Sans SC', sans-serif", '--font-num': "'Silkscreen', monospace",
      },
      brocade: {
        '--app-bg': 'radial-gradient(120% 120% at 50% -10%, #fdf4ee 0%, #f3e2dc 60%, #ecd6cf 100%)',
        '--texture': 'radial-gradient(circle, rgba(201,148,72,.14) 1px, transparent 1.7px) 0 0/26px 26px, repeating-linear-gradient(45deg, rgba(201,148,72,.06) 0 1px, transparent 1px 26px), repeating-linear-gradient(-45deg, rgba(201,148,72,.06) 0 1px, transparent 1px 26px)',
        '--hud-bg': 'linear-gradient(180deg,rgba(255,250,244,.96),rgba(251,238,229,.9))',
        '--dock-bg': 'linear-gradient(180deg,rgba(255,250,244,.72),rgba(250,236,225,.98))',
        '--panel-grad': 'linear-gradient(180deg,#fffdfa,#fbeee4)', '--panel-border': '#e3c896', '--hairline': 'rgba(216,164,78,.4)', '--chip-bg': 'rgba(255,255,255,.55)',
        '--seg-track': '#f3e3d4', '--seg-edge': '#e3c896', '--track': 'rgba(150,110,90,.18)',
        '--ink': '#5a3f44', '--ink-dim': '#a98b8f',
        '--accent': '#d8607b', '--accent-grad': 'linear-gradient(180deg,#e887a0,#cf5070)', '--accent-soft': 'rgba(216,96,123,.16)', '--accent-ink': '#fff',
        '--hp': '#54ad8e', '--gold': '#cf9a3f', '--gold-chip': 'rgba(207,154,63,.12)', '--danger': '#d65668',
        '--btn-bg': 'linear-gradient(180deg,#fffaf4,#fbece1)', '--btn-edge': '#ecd3b2', '--btn-text': '#6a4a4f',
        '--arena': 'radial-gradient(120% 120% at 50% 50%, #b3727b, #884a58 78%)', '--arena-edge': '#5f323d',
        '--ready-bg': 'linear-gradient(180deg,#ec9f6f,#d77a86)', '--ready-text': '#fff', '--ready-shadow': '0 8px 24px rgba(208,120,120,.4), inset 0 1px 0 rgba(255,255,255,.6)',
        '--font-cjk': "'Noto Serif SC', serif", '--font-display': "'Ma Shan Zheng', cursive", '--font-heading': "'Cormorant Garamond', serif", '--font-body': "'Noto Serif SC', serif", '--font-num': "'Silkscreen', monospace",
      },

  vals() {

    const W = 3000, H = 1500, VPW = 1284, VPH = 612;
    const Z = this.state.zoom, CX = this.state.camX, CY = this.state.camY;
    const seg = (on) => ({ padding: '7px 15px', borderRadius: '8px', cursor: 'pointer', fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: '13px', letterSpacing: '.03em', whiteSpace: 'nowrap', border: 'none', background: on ? 'var(--accent-grad)' : 'transparent', color: on ? 'var(--accent-ink)' : 'var(--ink-dim)', boxShadow: on ? 'inset 0 1px 0 rgba(255,255,255,.3)' : 'none', transition: 'all .15s ease' });

    const phaseBanner = { padding: '6px 22px', borderRadius: '99px', whiteSpace: 'nowrap', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: '20px', letterSpacing: '.04em', background: 'var(--accent-soft)', color: 'var(--accent)', border: '1px solid var(--accent)' };
    const nexBadgeA = { width: '46px', height: '46px', flex: 'none', borderRadius: '12px', background: 'var(--accent-grad)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: '24px', boxShadow: '0 0 14px var(--accent-soft)', border: '1px solid rgba(255,255,255,.3)' };

    const leverData = [

    const levers = leverData.map(([key, glyph, name, cost, desc]) => {
      const on = this.state.lever === key;
      return { key, glyph, name, cost, desc,
        row: { display: 'flex', alignItems: 'center', gap: '11px', padding: '11px 12px', borderRadius: '11px', cursor: 'pointer', border: '1px solid ' + (on ? 'var(--accent)' : 'var(--panel-border)'), background: on ? 'var(--accent-soft)' : 'var(--chip-bg)', boxShadow: on ? 'inset 0 0 0 1px var(--hairline), 0 0 14px var(--accent-soft)' : 'inset 0 0 0 1px var(--hairline)', transition: 'all .15s ease' },

    });

    const qb = (p0, p1, p2, t) => [Math.round((1 - t) * (1 - t) * p0[0] + 2 * (1 - t) * t * p1[0] + t * t * p2[0]), Math.round((1 - t) * (1 - t) * p0[1] + 2 * (1 - t) * t * p1[1] + t * t * p2[1])];
    const lpf = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t)];
    const A = [300, 750], B = [2700, 750];
    const TP = [[380, 650], [1500, 150], [2620, 650]], BP = [[380, 850], [1500, 1350], [2620, 850]], MP = [[460, 750], [2540, 750]];
    const top = (t) => qb(TP[0], TP[1], TP[2], t), bot = (t) => qb(BP[0], BP[1], BP[2], t), mid = (t) => lpf(MP[0], MP[1], t);

    const viewport = { position: 'relative', width: VPW + 'px', height: VPH + 'px', borderRadius: '20px', overflow: 'hidden', background: 'var(--arena-edge)', border: '8px solid var(--arena-edge)', boxShadow: 'inset 0 0 0 2px rgba(255,255,255,.07), 0 18px 40px rgba(0,0,0,.45)', cursor: 'grab', userSelect: 'none' };
    const world = { position: 'absolute', top: 0, left: 0, width: W + 'px', height: H + 'px', transformOrigin: '0 0', transform: 'translate(' + (VPW / 2 - CX * Z) + 'px,' + (VPH / 2 - CY * Z) + 'px) scale(' + Z + ')', background: 'var(--arena)', backgroundImage: 'repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 90px), repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 90px)' };
    const at = (p) => ({ left: p[0] + 'px', top: p[1] + 'px' });

    const mkNexus = (p, col, glow) => ({
      style: Object.assign({ position: 'absolute', width: '230px', height: '230px', transform: 'translate(-50%,-50%)', borderRadius: '40px', background: 'linear-gradient(160deg,#fbf7ef,#e7dac3)', border: '9px solid ' + col, boxShadow: '0 0 70px ' + glow + ', 0 24px 50px rgba(0,0,0,.55), inset 0 0 0 4px rgba(255,255,255,.6)', display: 'flex', alignItems: 'center', justifyContent: 'center' }, at(p)),
      crown: { position: 'absolute', top: '-46px', left: '50%', transform: 'translateX(-50%)', fontSize: '70px', color: 'var(--gold)', textShadow: '0 3px 10px rgba(0,0,0,.5)' },
      glyph: { fontSize: '128px', color: col },
      tag: { position: 'absolute', bottom: '-52px', left: '50%', transform: 'translateX(-50%)', padding: '5px 22px', borderRadius: '99px', background: 'rgba(8,12,10,.72)', color: '#fff', fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: '26px', whiteSpace: 'nowrap', border: '2px solid ' + col },
    });
    const nexusA = mkNexus(A, '#ff5d2e', 'rgba(255,93,46,.6)');
    const nexusB = mkNexus(B, '#3a86d4', 'rgba(58,134,212,.55)');

    const towerData = [[top(0.2), 'a', 's', 0.9], [top(0.8), 'b', 'h', 0.6], [mid(0.22), 'a', 's', 1.0], [mid(0.78), 'b', 'd', 0.55], [bot(0.2), 'a', 'c', 0.85], [bot(0.8), 'b', 'h', 0.6]];
    const towers = towerData.map(([p, team, suit, hp]) => { const col = team === 'a' ? '#ff5d2e' : '#3a86d4';
      return { glyph: SUITG[suit],
        style: Object.assign({ position: 'absolute', width: '100px', height: '120px', transform: 'translate(-50%,-50%)', borderRadius: '16px', background: 'linear-gradient(160deg,#fbf7ef,#e7dac3)', border: '6px solid ' + col, boxShadow: '0 0 26px ' + col + '66, 0 12px 26px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,255,255,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center' }, at(p)),
        glyphStyle: { fontSize: '52px', color: SUIT[suit] },
        hpTrack: { position: 'absolute', left: '8px', right: '8px', bottom: '-15px', height: '9px', borderRadius: '99px', background: 'rgba(0,0,0,.5)', overflow: 'hidden' },
        hpFill: { width: (hp * 100) + '%', height: '100%', background: col } };
    });

    let seed = 11; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const ut = [[top(0.1)], [top(0.27)], [top(0.4)], [top(0.62)], [top(0.76)], [top(0.9)], [mid(0.12)], [mid(0.27)], [mid(0.38)], [mid(0.63)], [mid(0.75)], [mid(0.88)], [bot(0.12)], [bot(0.28)], [bot(0.4)], [bot(0.62)], [bot(0.74)], [bot(0.88)]];
    const units = ut.map(([p], i) => {
      const t = (i % 6) / 5; const team = t < 0.5 ? 'a' : 'b'; const col = team === 'a' ? '#ff5d2e' : '#3a86d4';
      const sk = ['s', 'h', 'd', 'c'][i % 4]; const rank = ['A', 'K', 'Q', 'J', '10', '9', '8', '7'][i % 8];
      const rot = (rnd() * 12 - 6).toFixed(1); const faceDown = team === 'b' && rnd() > 0.6;
      const base = Object.assign({ position: 'absolute', width: '74px', height: '102px', '--rot': rot + 'deg', transform: 'translate(-50%,-50%) rotate(' + rot + 'deg)', animation: 'g-march ' + (2.6 + (i % 4) * 0.4).toFixed(1) + 's ease-in-out infinite', borderRadius: '11px', display: 'flex', alignItems: 'center', justifyContent: 'center' }, at(p));
      if (!faceDown) return { faceUp: true, rank, glyph: SUITG[sk],
        style: Object.assign({}, base, { background: 'linear-gradient(160deg,#fbf7ef,#e9dcc6)', border: '4px solid ' + col, boxShadow: '0 8px 18px rgba(0,0,0,.5), 0 0 18px ' + col + '55, inset 0 0 0 2px rgba(255,255,255,.6)' }),
        corner: { position: 'absolute', top: '5px', left: '8px', fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: '21px', color: SUIT[sk] },

        hpFill: { width: (40 + rnd() * 60) + '%', height: '100%', background: col } };
      return { faceUp: false,
        style: Object.assign({}, base, { background: '#274a73', border: '4px solid #16314e', boxShadow: '0 8px 18px rgba(0,0,0,.5)' }),
        back: { position: 'absolute', inset: '8px', borderRadius: '6px', border: '2px solid rgba(255,255,255,.4)', background: 'repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 8px, transparent 8px 16px), repeating-linear-gradient(-45deg, rgba(255,255,255,.16) 0 8px, transparent 8px 16px)' } };
    });

    const laneLbl = (p) => Object.assign({ position: 'absolute', transform: 'translate(-50%,-50%)', padding: '6px 20px', borderRadius: '99px', background: 'rgba(8,12,10,.55)', color: 'rgba(255,255,255,.85)', fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: '30px', letterSpacing: '.12em', backdropFilter: 'blur(2px)', border: '1px solid rgba(255,255,255,.18)' }, at(p));
    const laneTopLbl = laneLbl([top(0.13)[0], top(0.13)[1] - 34]);
    const laneMidLbl = laneLbl([mid(0.13)[0], mid(0.13)[1] - 70]);
    const laneBotLbl = laneLbl([bot(0.13)[0], bot(0.13)[1] + 34]);

    const mkClash = (p, s, labelText) => ({
      rank: 'A', glyph: '♠', labelText,
      stage: Object.assign({ position: 'absolute', width: '0', height: '0' }, at(p)),
      ring: { position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)', width: (320 * s) + 'px', height: (320 * s) + 'px', borderRadius: '50%', border: '3px dashed rgba(255,255,255,.32)', background: 'radial-gradient(circle, rgba(255,210,120,.14), transparent 70%)' },
      live: { position: 'absolute', left: '50%', top: '50%', width: (116 * s) + 'px', height: (160 * s) + 'px', marginLeft: (-86 * s) + 'px', borderRadius: (14 * s) + 'px', background: 'linear-gradient(160deg,#fbf7ef,#e9dcc6)', border: (5 * s) + 'px solid var(--hp)', boxShadow: '0 20px 44px rgba(0,0,0,.5), 0 0 34px rgba(70,209,122,.7), inset 0 0 0 ' + (3 * s) + 'px rgba(255,255,255,.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'g-tossL 2.4s ease-in-out infinite', zIndex: 6 },
      liveCorner: { position: 'absolute', top: (8 * s) + 'px', left: (10 * s) + 'px', fontFamily: 'var(--font-heading)', fontWeight: 700, fontSize: (22 * s) + 'px', lineHeight: '.9', color: SUIT.s, textAlign: 'center' },
      liveGlyph: { fontSize: (66 * s) + 'px', color: SUIT.s },
      dead: { position: 'absolute', left: '50%', top: '50%', width: (116 * s) + 'px', height: (160 * s) + 'px', marginLeft: (-30 * s) + 'px', borderRadius: (14 * s) + 'px', background: '#9c3324', border: (5 * s) + 'px solid var(--danger)', boxShadow: '0 20px 44px rgba(0,0,0,.5), 0 0 30px rgba(255,64,79,.5)', animation: 'g-tossR 2.4s ease-in-out infinite', opacity: .92, zIndex: 5 },
      deadBack: { position: 'absolute', inset: (10 * s) + 'px', borderRadius: (8 * s) + 'px', border: (3 * s) + 'px solid rgba(255,255,255,.4)', background: 'repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 ' + (9 * s) + 'px, transparent ' + (9 * s) + 'px ' + (18 * s) + 'px), repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 ' + (9 * s) + 'px, transparent ' + (9 * s) + 'px ' + (18 * s) + 'px)' },

              ${forr(v.clashes, (c) => `<div style="${st(c.stage)}"><div style="${st(c.ring)}"></div><div style="${st(c.live)}"><div style="${st(c.liveCorner)}">${c.rank}<br>${c.glyph}</div><span style="${st(c.liveGlyph)}">${c.glyph}</span></div><div style="${st(c.dead)}"><div style="${st(c.deadBack)}"></div></div><div style="${st(c.spark)}"></div><div style="${st(c.label)}">${esc(c.labelText)}</div><div style="${st(c.verdictRow)}"><span style="${st(c.vLive)}">正面·生</span><span style="${st(c.vDead)}">反面·死</span></div></div>`)}
            </div>
            <div style="${st(v.focusBar)}">
              <button data-act="focus" data-k="home" style="${st(v.focusChip)}">⌂ 我方老家</button>
              <button data-act="focus" data-k="fight" style="${st(v.focusChipOn)}">⚔ 中路团战</button>
              <button data-act="focus" data-k="enemy" style="${st(v.focusChip)}">⚑ 敌方老家</button>
              <button data-act="focus" data-k="all" style="${st(v.focusChip)}">▦ 全局</button>
            </div>
            <div style="${st(v.zoomBox)}">
              <button data-act="zoom" data-k="out" style="${st(v.zoomBtn)}">－</button>
              <input type="range" class="gz" min="0.55" max="2.6" step="0.05" value="${v.zoomVal}" data-act="zoominput" style="${st(v.zoomSlider)}">
              <button data-act="zoom" data-k="in" style="${st(v.zoomBtn)}">＋</button>
              <span style="${st(v.zoomLabel)}">${v.zoomPct}</span>
            </div>
            <div style="${st(v.hintTag)}">🖱 拖拽平移 · 滚轮缩放 · 点「门」开/关捷径</div>
            <div style="${st(v.mmBox)}">
              <div style="position:absolute; top:6px; left:9px; font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:.1em; color:rgba(255,255,255,.8); z-index:3;">战场全局</div>
              <div style="${st(v.mmInner)}">
                ${forr(v.mmLanes, (l) => `<div style="${st(l)}"></div>`)}
                ${forr(v.mmBlips, (b) => `<div style="${st(b)}"></div>`)}
                <div style="${st(v.mmViewRect)}"></div>
                <div data-act="mmdown" style="${st(v.mmHit)}"></div>
              </div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:9px; padding:9px 14px; border-radius:16px; background:var(--dock-bg); border:1px solid var(--panel-border); box-shadow:inset 0 0 0 1px var(--hairline);">
            <span style="font-family:var(--font-heading); font-weight:700; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); writing-mode:vertical-rl; transform:rotate(180deg);">手牌</span>
            ${forr(v.hand, (h) => `<div style="${st(h.slot)}">${h.filled ? `<div style="${st(h.corner)}">${h.rank}</div><span style="${st(h.glyphStyle)}">${h.glyph}</span>` : ''}</div>`)}
          </div>
        </div>
        <!-- RIGHT RAIL -->
        <div style="position:absolute; top:112px; right:18px; width:284px; bottom:172px; display:flex; flex-direction:column; gap:11px;">
          <div style="font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-dim); padding:2px 4px;">三路战况 · Lanes</div>
          <div style="display:flex; flex-direction:column; gap:9px;">
            ${forr(v.laneStatus, (l) => `<div style="${st(l.card)}"><div style="display:flex; align-items:center; gap:8px; margin-bottom:9px;"><div style="${st(l.tag)}">${esc(l.name)}</div><span style="flex:1;"></span><span style="${st(l.stateStyle)}">${esc(l.state)}</span></div><div style="${st(l.barTrack)}"><div style="${st(l.barMine)}"></div><div style="${st(l.barEnemy)}"></div><div style="${st(l.midMark)}"></div></div><div style="display:flex; justify-content:space-between; margin-top:6px;"><span style="font-family:var(--font-num); font-size:10px; color:var(--accent);">${esc(l.mineText)}</span><span style="font-family:var(--font-num); font-size:10px; color:#3a86d4;">${esc(l.enemyText)}</span></div></div>`)}
          </div>
          <div style="${st(v.panel)}"><div style="${st(v.panelHead)}">当前对手</div><div style="display:flex; align-items:center; gap:10px;"><div style="${st(v.oppAv)}">♥</div><div style="flex:1; min-width:0;"><div style="display:flex; align-items:center; gap:6px;"><span style="font-family:var(--font-heading); font-weight:700; font-size:15px; color:var(--ink);">红桃皇后</span><span style="${st(v.oppTag)}">蓝方</span></div><div style="font-size:11px; color:var(--ink-dim); margin-top:3px;">♥ 火攻流 · 中路压制</div></div></div></div>
          <div style="${st(v.panel)}"><div style="${st(v.panelHead)}">台面机关</div><div style="${st(v.augRow)}"><span style="font-size:18px;">🌪</span><div><div style="font-family:var(--font-heading); font-weight:700; font-size:13px; color:var(--ink);">河道·低重力</div><div style="font-size:11px; color:var(--ink-dim);">过河掷命滞空更久</div></div></div></div>
        </div>
        <!-- BOTTOM BAR -->
        <div style="position:absolute; left:0; right:0; bottom:0; height:160px; background:var(--dock-bg); border-top:1px solid var(--panel-border); padding:18px 30px; z-index:7; display:flex; align-items:stretch; gap:16px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="display:flex; align-items:center; gap:9px; padding:0 16px; height:100%; border-radius:14px; background:var(--gold-chip); border:1px solid var(--gold);"><span style="font-size:22px;">◈</span><span style="font-family:var(--font-num); font-size:28px; color:var(--gold);">28</span></div>
            <div style="display:flex; flex-direction:column; justify-content:center; gap:7px; padding:0 16px; height:100%; border-radius:14px; background:var(--chip-bg); border:1px solid var(--panel-border); min-width:150px;">
              <div style="display:flex; justify-content:space-between; align-items:baseline;"><span style="font-family:var(--font-heading); font-weight:700; font-size:14px; color:var(--ink);">干预能量</span><span style="font-family:var(--font-num); font-size:11px; color:var(--accent);">3/5</span></div>
              <div style="display:flex; gap:5px;">${forr(v.energyPips, (e) => `<div style="${st(e)}"></div>`)}</div>
            </div>
          </div>
          <div style="flex:1; display:flex; flex-direction:column; gap:9px; justify-content:center; padding:0 18px; border-radius:16px; background:var(--accent-soft); border:1px solid var(--accent); box-shadow:inset 0 0 0 1px var(--hairline);">
            <div style="display:flex; align-items:center; gap:10px;"><span style="font-family:var(--font-heading); font-weight:700; font-size:18px; color:var(--accent); letter-spacing:.03em;">选路派牌</span><span style="font-size:12px; color:var(--ink-dim);">把牌派往一路推进,接敌即掷命</span></div>
            <div style="display:flex; gap:10px;">${forr(v.laneBtns, (b) => `<button data-act="lane" data-k="${b.key}" style="${st(b.style)}">${esc(b.label)}<span style="${st(b.sub)}">${esc(b.subText)}</span></button>`)}</div>
          </div>
          <div style="width:210px; flex:none; display:flex; flex-direction:column; gap:8px;">
            <button data-act="ready" style="${st(v.readyBtn)}"><span style="position:absolute; inset:0; border-radius:inherit; background:linear-gradient(110deg,transparent 36%,rgba(255,255,255,.4) 50%,transparent 64%); background-size:230% 100%; animation:g-shimmer 3s ease-in-out infinite; pointer-events:none;"></span><span style="position:relative; font-family:var(--font-heading); font-weight:700; font-size:24px; letter-spacing:.08em;">派牌出战</span><span style="position:relative; font-size:11px; letter-spacing:.22em; opacity:.85; margin-top:2px;">DEPLOY · ${esc(v.laneSubLabel)}</span></button>
          </div>
        </div>
      </div>
      </div>
    </div>`;
    this._A = v.A; this._B = v.B; this._mid = v.mid;
  },

  wire() {
    const app = document.getElementById('app');
    app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]'); if (!el) return;
      const act = el.dataset.act, k = el.dataset.k;
      if (act === 'theme') this.setState({ theme: k });
      else if (act === 'lever') this.setState({ lever: k });
      else if (act === 'lane') this.setState({ lane: k });
      else if (act === 'gate') this.setState((s) => ({ gates: Object.assign({}, s.gates, { [k]: !s.gates[k] }) }));
      else if (act === 'zoom') this.setZoom(this.state.zoom + (k === 'in' ? 0.2 : -0.2));
      else if (act === 'focus') { if (k === 'home') this.setView(this._A[0] + 260, 750, 1.5); else if (k === 'fight') this.setView(this._mid(0.5)[0], this._mid(0.5)[1], 1.4); else if (k === 'enemy') this.setView(this._B[0] - 260, 750, 1.5); else this.setView(1500, 750, 0.55); }
    });
    app.addEventListener('input', (e) => { if (e.target.dataset && e.target.dataset.act === 'zoominput') this.setZoom(parseFloat(e.target.value)); });
    app.addEventListener('wheel', (e) => { if (e.target.closest('[data-act="vpdown"]')) { e.preventDefault(); this.setZoom(this.state.zoom * (e.deltaY < 0 ? 1.12 : 0.89)); } }, { passive: false });
    app.addEventListener('mousedown', (e) => {
      if (e.target.closest('[data-act="mmdown"]')) { this._mmEl = e.target.closest('[data-act="mmdown"]'); this._mm = true; this.mmTo(e); }
      else if (e.target.closest('[data-act="vpdown"]')) { this._drag = { mx: e.clientX, my: e.clientY, cx: this.state.camX, cy: this.state.camY }; }
    });
    window.addEventListener('mousemove', (e) => {
      if (this._drag) { const kf = this._OUT * this.state.zoom; this.setCam(this._drag.cx - (e.clientX - this._drag.mx) / kf, this._drag.cy - (e.clientY - this._drag.my) / kf); }
      else if (this._mm) this.mmTo(e);
    });
    window.addEventListener('mouseup', () => { this._drag = null; this._mm = null; });
  },
};
App.render();
App.wire();
</script>
</body>
</html>
